services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/capacity_planner.db
    volumes:
      - planner-data:/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
volumes:
  planner-data:

